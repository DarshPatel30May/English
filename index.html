<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive visual study guide for the 2026 NSW HSC English Standard course: Common Module, Module A, Module B and Module C." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>HSC English Standard 2026 · Visual Study Guide</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('hsc:theme') || 'null');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
